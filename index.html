<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квизи 🎯</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- МЕНЮ -->
    <div id="menu" class="menu">

        <div class="menu-box">

            <h1>🎯 КВИЗИ</h1>

            <p class="subtitle">
                Проверь свои знания!
            </p>

            <div class="menu-info">
                💰 Деньги: <span id="menuMoney">0</span>
            </div>

            <button id="startButton" class="main-button">
                🎮 Начать игру
            </button>

        </div>

    </div>


    <!-- ИГРА -->
    <div id="game" class="game">

        <div class="top-bar">

            <div id="level" class="level">
                Уровень: 1
            </div>

            <div id="money" class="money">
                0 💰
            </div>

        </div>


        <div class="quiz-box">

            <div class="question-title">
                ВОПРОС
            </div>

            <div id="question" class="question">
                Нажми «Начать игру»
            </div>

            <div id="answers" class="answers">
                <!-- Ответы появляются здесь -->
            </div>

            <div id="result" class="result">
                <!-- Результат появляется здесь -->
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
